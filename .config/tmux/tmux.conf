set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Logging configuration - logs go to ~/logs/
bind-key H pipe-pane -o "cat >> ~/logs/tmux-session-#S-window-#I-pane-#P-$(date '+%Y%m%d_%H%M%S').log" \; display-message "Started logging to ~/logs/"
bind-key h pipe-pane \; display-message "Stopped logging"

# Auto-log all new sessions (optional - uncomment if you want automatic logging)
# set-hook -g after-new-session 'pipe-pane -o "cat >> ~/logs/tmux-session-#S-window-#I-pane-#P-$(date '+%Y%m%d_%H%M%S').log"'

run '~/.config/tmux/plugins/tpm/tpm
